<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Self Photobox Dinamis (3 & 4 Pose)</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #121212;
        color: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
      }

      /* ==================== 1. SPLASH SCREEN ==================== */
      #splashScreen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        z-index: 100;
      }
      .splash-icon {
        font-size: 4.5rem;
        margin-bottom: 12px;
      }
      #splashScreen h1 {
        font-size: 2rem;
        margin: 0 0 8px;
      }
      #splashScreen p {
        color: #cbd5e1;
        max-width: 360px;
        margin: 0 0 28px;
        line-height: 1.5;
      }
      .btn-primary {
        background: #ff4757;
        color: #fff;
        border: none;
        padding: 16px 36px;
        font-size: 1.15rem;
        font-weight: 700;
        border-radius: 50px;
        cursor: pointer;
      }

      /* ==================== 2. PILIH BINGKAI ==================== */
      #frameSelectScreen {
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px;
        min-height: 100vh;
      }
      #frameSelectScreen h2 {
        margin: 0 0 6px;
        font-size: 1.4rem;
      }
      .subtitle {
        color: #94a3b8;
        font-size: 0.9rem;
        margin: 0 0 18px;
        text-align: center;
      }

      .frame-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        width: 100%;
        max-width: 480px;
        margin-bottom: 20px;
      }
      .frame-card {
        background: #1e293b;
        border: 3px solid transparent;
        border-radius: 12px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        position: relative;
      }
      .frame-card.selected {
        border-color: #2ed573;
        background: #1e3a2f;
      }
      .badge {
        position: absolute;
        top: 8px;
        right: 8px;
        background: #0f172a;
        color: #38bdf8;
        font-size: 11px;
        font-weight: 700;
        padding: 3px 7px;
        border-radius: 6px;
      }
      .frame-card img {
        width: 84px;
        height: 252px;
        object-fit: contain;
        border-radius: 4px;
        background: #fff;
        margin-bottom: 8px;
      }
      .frame-card span.title {
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
      }

      .upload-box {
        width: 84px;
        height: 252px;
        border: 2px dashed #64748b;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 6px;
        font-size: 0.78rem;
        color: #cbd5e1;
        margin-bottom: 8px;
      }
      .custom-pose-toggle {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .pose-pill {
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 700;
        border-radius: 6px;
        border: 1px solid #64748b;
        background: #0f172a;
        color: #fff;
        cursor: pointer;
      }
      .pose-pill.active {
        background: #2ed573;
        color: #000;
        border-color: #2ed573;
      }
      input[type="file"] {
        display: none;
      }

      /* ==================== 3. SESI FOTO ==================== */
      #photoSessionScreen {
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        min-height: 100vh;
      }
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 540px;
        margin-bottom: 10px;
      }
      .btn-small {
        background: #2f3542;
        color: #fff;
        border: none;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
      }

      .camera-wrapper {
        position: relative;
        width: 100%;
        max-width: 540px;
        aspect-ratio: 4 / 3;
        background: #000;
        border-radius: 14px;
        overflow: hidden;
        border: 2px solid #333;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      video.mirror {
        transform: scaleX(-1);
      }

      .guide-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .guide-box {
        height: 94%;
        aspect-ratio: 540 / 420;
        border: 2px dashed rgba(46, 213, 115, 0.9);
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
        position: relative;
        border-radius: 6px;
      }
      .guide-label {
        position: absolute;
        top: 6px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(46, 213, 115, 0.9);
        color: #000;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 4px;
        white-space: nowrap;
      }

      #countdown {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 6.5rem;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 4px 16px rgba(0, 0, 0, 0.9);
        pointer-events: none;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease-out;
      }

      /* Thumbnail Dinamis (3 atau 4 slot) */
      .thumbs {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        width: 100%;
        max-width: 540px;
        justify-content: center;
      }
      .thumb-slot {
        flex: 1;
        aspect-ratio: 540 / 420;
        background: #1e1e1e;
        border: 2px dashed #444;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        color: #888;
        overflow: hidden;
      }
      .thumb-slot img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 14px;
        width: 100%;
        max-width: 540px;
      }
      button {
        padding: 12px 16px;
        font-size: 0.95rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        color: #fff;
        background: #2f3542;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #captureBtn {
        background: #ff4757;
        width: 100%;
        font-size: 1.1rem;
        padding: 15px;
      }
      #saveBtn {
        background: #1e90ff;
      }
      #printBtn {
        background: #2ed573;
        color: #000;
      }

      .result-area {
        margin-top: 20px;
        display: none;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }
      canvas#canvas4R {
        width: 100%;
        max-width: 380px;
        height: auto;
        border: 2px solid #fff;
        border-radius: 4px;
        background: #fff;
      }

      @media print {
        @page {
          size: 10.2cm 15.2cm;
          margin: 0;
        }
        body {
          margin: 0;
          padding: 0;
          background: #fff;
        }
        body > *:not(#photoSessionScreen) {
          display: none !important;
        }
        #photoSessionScreen > *:not(.result-area) {
          display: none !important;
        }
        .result-area {
          display: block !important;
          margin: 0;
          padding: 0;
        }
        .result-area .controls {
          display: none !important;
        }
        canvas#canvas4R {
          width: 10.2cm !important;
          height: 15.2cm !important;
          max-width: none !important;
          border: none !important;
          border-radius: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ==================== 1. SPLASH SCREEN ==================== -->
    <div id="splashScreen">
      <div class="splash-icon">📸</div>
      <h1>SELF PHOTOBOX</h1>
      <p>
        Pilih bingkai 3 atau 4 pose, bergaya bebas, dan langsung cetak ukuran
        4R!
      </p>
      <button class="btn-primary" id="enterAppBtn">Mulai Sekarang</button>
    </div>

    <!-- ==================== 2. PILIH BINGKAI ==================== -->
    <div id="frameSelectScreen">
      <h2>Pilih Desain Bingkai</h2>
      <p class="subtitle">
        Jumlah foto otomatis mengikuti bingkai yang dipilih
      </p>

      <div class="frame-grid" id="frameGrid">
        <!-- Kartu Unggah Bingkai Kustom Canva -->
        <div class="frame-card" id="customUploadCard">
          <span class="badge" id="customBadge">3 Foto</span>
          <label
            style="
              cursor: pointer;
              display: flex;
              flex-direction: column;
              align-items: center;
            "
          >
            <div class="upload-box" id="uploadPreviewBox">
              <span style="font-size: 1.6rem; margin-bottom: 4px">➕</span>
              <span>Unggah PNG Canva</span>
            </div>
            <input type="file" id="frameInput" accept="image/png" />
          </label>
          <span class="title">Bingkai Kustom</span>
          <div class="custom-pose-toggle">
            <button type="button" class="pose-pill active" id="pill3">
              3 Pose
            </button>
            <button type="button" class="pose-pill" id="pill4">4 Pose</button>
          </div>
        </div>
      </div>

      <button class="btn-primary" id="confirmFrameBtn">
        Lanjut ke Kamera ➔
      </button>
    </div>

    <!-- ==================== 3. SESI FOTO ==================== -->
    <div id="photoSessionScreen">
      <div class="top-bar">
        <button class="btn-small" id="backToFrameBtn">⬅ Ganti Bingkai</button>
        <span
          id="sessionHeaderLabel"
          style="font-size: 0.9rem; font-weight: 600; color: #cbd5e1"
          >Sesi 3 Pose</span
        >
        <button class="btn-small" id="switchCamBtn">🔄 Kamera</button>
      </div>

      <div class="camera-wrapper">
        <video id="video" autoplay playsinline></video>
        <div class="guide-overlay">
          <div class="guide-box" id="guideBox">
            <span class="guide-label">AREA MASUK BINGKAI</span>
          </div>
        </div>
        <div id="countdown"></div>
        <div id="flash"></div>
      </div>

      <!-- Container Thumbnail Dinamis (Otomatis 3 atau 4 slot) -->
      <div class="thumbs" id="thumbsContainer"></div>

      <div class="controls">
        <button id="captureBtn">Ambil Foto 1 (Klik / Remote)</button>
        <button id="resetBtn">Ulangi Sesi</button>
      </div>

      <div class="result-area" id="resultArea">
        <canvas id="canvas4R"></canvas>
        <div class="controls">
          <button id="saveBtn">Simpan Gambar 4R</button>
          <button id="printBtn">Cetak 4R</button>
        </div>
      </div>
    </div>

    <script>
      const LAYOUTS = {
        3: {
          count: 3,
          w: 540,
          h: 420,
          coords: [
            { x: 30, y: 30 },
            { x: 30, y: 480 },
            { x: 30, y: 930 },
          ],
          footerY: 1520,
        },
        4: {
          count: 4,
          w: 540,
          h: 350,
          coords: [
            { x: 30, y: 25 },
            { x: 30, y: 400 },
            { x: 30, y: 775 },
            { x: 30, y: 1150 },
          ],
          footerY: 1630,
        },
      };

      const splashScreen = document.getElementById("splashScreen");
      const frameSelectScreen = document.getElementById("frameSelectScreen");
      const photoSessionScreen = document.getElementById("photoSessionScreen");
      const enterAppBtn = document.getElementById("enterAppBtn");
      const confirmFrameBtn = document.getElementById("confirmFrameBtn");
      const backToFrameBtn = document.getElementById("backToFrameBtn");
      const frameGrid = document.getElementById("frameGrid");
      const customUploadCard = document.getElementById("customUploadCard");
      const frameInput = document.getElementById("frameInput");
      const uploadPreviewBox = document.getElementById("uploadPreviewBox");
      const pill3 = document.getElementById("pill3");
      const pill4 = document.getElementById("pill4");
      const customBadge = document.getElementById("customBadge");

      const video = document.getElementById("video");
      const guideBox = document.getElementById("guideBox");
      const countdownEl = document.getElementById("countdown");
      const flashEl = document.getElementById("flash");
      const thumbsContainer = document.getElementById("thumbsContainer");
      const sessionHeaderLabel = document.getElementById("sessionHeaderLabel");
      const captureBtn = document.getElementById("captureBtn");
      const switchCamBtn = document.getElementById("switchCamBtn");
      const resetBtn = document.getElementById("resetBtn");
      const resultArea = document.getElementById("resultArea");
      const canvas4R = document.getElementById("canvas4R");
      const saveBtn = document.getElementById("saveBtn");
      const printBtn = document.getElementById("printBtn");
      const ctx = canvas4R.getContext("2d");

      let facingMode = "environment";
      let currentStream = null;
      let isCounting = false;
      let photos = [];
      let selectedFrameImg = null;
      let selectedPoseCount = 3;
      let customPoseCount = 3;
      let customImgObj = null;
      let currentScreen = "splash";

      // ==================== 1. GENERATOR BINGKAI BAWAAN (3 & 4 FOTO) ====================
      const presetThemes = [
        {
          name: "Klasik Putih",
          poses: 3,
          bg: "#ffffff",
          text: "#222222",
          accent: "#e2e8f0",
          title: "MINI PHOTOBOOTH",
        },
        {
          name: "Elegan Hitam",
          poses: 4,
          bg: "#18181b",
          text: "#ffffff",
          accent: "#3f3f46",
          title: "STUDIO 4-CUT",
        },
        {
          name: "Pastel Pink",
          poses: 4,
          bg: "#ffe4e6",
          text: "#be123c",
          accent: "#fecdd3",
          title: "SWEET MEMORIES",
        },
      ];

      function createPresetFrame(theme) {
        const layout = LAYOUTS[theme.poses];
        const c = document.createElement("canvas");
        c.width = 600;
        c.height = 1800;
        const fCtx = c.getContext("2d");

        fCtx.fillStyle = theme.bg;
        fCtx.fillRect(0, 0, 600, 1800);

        layout.coords.forEach((pos) => {
          fCtx.clearRect(pos.x, pos.y, layout.w, layout.h);
          fCtx.strokeStyle = theme.accent;
          fCtx.lineWidth = 4;
          fCtx.strokeRect(pos.x, pos.y, layout.w, layout.h);
        });

        fCtx.fillStyle = theme.text;
        fCtx.font = "bold 28px sans-serif";
        fCtx.textAlign = "center";
        fCtx.fillText(theme.title, 300, layout.footerY);

        fCtx.font = "18px sans-serif";
        fCtx.globalAlpha = 0.75;
        fCtx.fillText(
          new Date().toLocaleDateString("id-ID", {
            day: "numeric",
            month: "long",
            year: "numeric",
          }),
          300,
          layout.footerY + 40,
        );

        return c.toDataURL("image/png");
      }

      presetThemes.forEach((theme, index) => {
        const dataUrl = createPresetFrame(theme);
        const card = document.createElement("div");
        card.className = "frame-card" + (index === 0 ? " selected" : "");
        card.innerHTML = `
        <span class="badge">${theme.poses} Foto</span>
        <img src="${dataUrl}" alt="${theme.name}" />
        <span class="title">${theme.name}</span>
      `;

        const imgObj = new Image();
        imgObj.src = dataUrl;
        if (index === 0) {
          selectedFrameImg = imgObj;
          selectedPoseCount = theme.poses;
        }

        card.addEventListener("click", () => {
          document
            .querySelectorAll(".frame-card")
            .forEach((el) => el.classList.remove("selected"));
          card.classList.add("selected");
          selectedFrameImg = imgObj;
          selectedPoseCount = theme.poses;
        });

        frameGrid.insertBefore(card, customUploadCard);
      });

      // Pengaturan Pilihan 3 Pose / 4 Pose untuk Bingkai Kustom Canva
      function setCustomPoseMode(count, e) {
        e.stopPropagation();
        customPoseCount = count;
        customBadge.textContent = count + " Foto";
        pill3.classList.toggle("active", count === 3);
        pill4.classList.toggle("active", count === 4);
        if (customImgObj) {
          selectCustomCard();
        }
      }
      pill3.addEventListener("click", (e) => setCustomPoseMode(3, e));
      pill4.addEventListener("click", (e) => setCustomPoseMode(4, e));

      function selectCustomCard() {
        if (!customImgObj) return;
        document
          .querySelectorAll(".frame-card")
          .forEach((el) => el.classList.remove("selected"));
        customUploadCard.classList.add("selected");
        selectedFrameImg = customImgObj;
        selectedPoseCount = customPoseCount;
      }

      customUploadCard.addEventListener("click", () => {
        if (customImgObj) selectCustomCard();
      });

      frameInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            customImgObj = img;
            uploadPreviewBox.innerHTML = `<img src="${ev.target.result}" style="width:100%; height:100%; object-fit:contain; border:none; margin:0;" />`;
            uploadPreviewBox.style.border = "none";
            uploadPreviewBox.style.padding = "0";
            selectCustomCard();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });

      // ==================== 2. NAVIGASI LAYAR ====================
      enterAppBtn.addEventListener("click", () => {
        splashScreen.style.display = "none";
        frameSelectScreen.style.display = "flex";
        currentScreen = "frameSelect";
      });

      confirmFrameBtn.addEventListener("click", () => {
        if (!selectedFrameImg) {
          alert("Pilih bingkai terlebih dahulu!");
          return;
        }
        frameSelectScreen.style.display = "none";
        photoSessionScreen.style.display = "flex";
        currentScreen = "photoSession";
        setupSessionUI();
        startCamera();
      });

      backToFrameBtn.addEventListener("click", () => {
        if (currentStream) {
          currentStream.getTracks().forEach((track) => track.stop());
        }
        photoSessionScreen.style.display = "none";
        frameSelectScreen.style.display = "flex";
        currentScreen = "frameSelect";
      });

      function setupSessionUI() {
        const layout = LAYOUTS[selectedPoseCount];
        sessionHeaderLabel.textContent = `Sesi ${selectedPoseCount} Pose`;
        guideBox.style.aspectRatio = `${layout.w} / ${layout.h}`;
        resetSession();
      }

      // ==================== 3. KAMERA & PEMOTRETAN ====================
      async function startCamera() {
        if (currentStream) {
          currentStream.getTracks().forEach((track) => track.stop());
        }
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: facingMode,
              width: { ideal: 1920 },
              height: { ideal: 1440 },
            },
            audio: false,
          });
          video.srcObject = currentStream;
          video.classList.toggle("mirror", facingMode === "user");
        } catch (err) {
          alert(
            "Kamera gagal diakses. Pastikan dibuka lewat HTTPS atau localhost.\n" +
              err.message,
          );
        }
      }

      function triggerCapture() {
        if (
          currentScreen !== "photoSession" ||
          isCounting ||
          photos.length >= selectedPoseCount
        )
          return;
        isCounting = true;
        captureBtn.disabled = true;

        let count = 3;
        countdownEl.textContent = count;

        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            countdownEl.textContent = count;
          } else {
            clearInterval(timer);
            countdownEl.textContent = "";
            takeSnapshot();
          }
        }, 1000);
      }

      function takeSnapshot() {
        flashEl.style.opacity = "1";
        setTimeout(() => (flashEl.style.opacity = "0"), 150);

        const layout = LAYOUTS[selectedPoseCount];
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const targetRatio = layout.w / layout.h;

        let cropW = vw;
        let cropH = vh;
        if (vw / vh > targetRatio) {
          cropW = vh * targetRatio;
        } else {
          cropH = vw / targetRatio;
        }
        const sx = (vw - cropW) / 2;
        const sy = (vh - cropH) / 2;

        const snapCanvas = document.createElement("canvas");
        snapCanvas.width = layout.w;
        snapCanvas.height = layout.h;
        const sCtx = snapCanvas.getContext("2d");

        if (facingMode === "user") {
          sCtx.translate(layout.w, 0);
          sCtx.scale(-1, 1);
        }
        sCtx.drawImage(video, sx, sy, cropW, cropH, 0, 0, layout.w, layout.h);

        const idx = photos.length;
        photos.push(snapCanvas);

        document.getElementById("slot" + idx).innerHTML =
          `<img src="${snapCanvas.toDataURL("image/jpeg", 0.9)}" />`;
        isCounting = false;

        if (photos.length < selectedPoseCount) {
          captureBtn.disabled = false;
          captureBtn.textContent = `Ambil Foto ${photos.length + 1} dari ${selectedPoseCount} (Klik / Remote)`;
        } else {
          captureBtn.textContent = `Selesai (${selectedPoseCount} Pose Lengkap)`;
          render4R();
        }
      }

      function render4R() {
        const layout = LAYOUTS[selectedPoseCount];
        const stripW = 600;
        const stripH = 1800;
        canvas4R.width = stripW * 2;
        canvas4R.height = stripH;

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas4R.width, canvas4R.height);

        [0, stripW].forEach((offsetX) => {
          photos.forEach((photo, i) => {
            const pos = layout.coords[i];
            ctx.drawImage(photo, offsetX + pos.x, pos.y, layout.w, layout.h);
          });
          if (selectedFrameImg) {
            ctx.drawImage(selectedFrameImg, offsetX, 0, stripW, stripH);
          }
        });

        // Garis bantu potong di tengah
        ctx.save();
        ctx.strokeStyle = "#cccccc";
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(stripW, 0);
        ctx.lineTo(stripW, stripH);
        ctx.stroke();
        ctx.restore();

        resultArea.style.display = "flex";
        resultArea.scrollIntoView({ behavior: "smooth" });
      }

      function resetSession() {
        const layout = LAYOUTS[selectedPoseCount];
        photos = [];
        isCounting = false;
        captureBtn.disabled = false;
        captureBtn.textContent = `Ambil Foto 1 dari ${selectedPoseCount} (Klik / Remote)`;
        resultArea.style.display = "none";

        thumbsContainer.innerHTML = "";
        for (let i = 0; i < selectedPoseCount; i++) {
          const slot = document.createElement("div");
          slot.className = "thumb-slot";
          slot.id = "slot" + i;
          slot.style.aspectRatio = `${layout.w} / ${layout.h}`;
          slot.textContent = "Foto " + (i + 1);
          thumbsContainer.appendChild(slot);
        }
      }

      captureBtn.addEventListener("click", triggerCapture);
      resetBtn.addEventListener("click", resetSession);
      switchCamBtn.addEventListener("click", () => {
        facingMode = facingMode === "environment" ? "user" : "environment";
        startCamera();
      });

      saveBtn.addEventListener("click", () => {
        const link = document.createElement("a");
        link.download =
          `photostrip-${selectedPoseCount}pose-4R-` + Date.now() + ".png";
        link.href = canvas4R.toDataURL("image/png");
        link.click();
      });

      printBtn.addEventListener("click", () => window.print());

      window.addEventListener("keydown", (e) => {
        const validKeys = [
          "Enter",
          " ",
          "AudioVolumeUp",
          "AudioVolumeDown",
          "VolumeUp",
          "VolumeDown",
        ];
        if (validKeys.includes(e.key)) {
          e.preventDefault();
          triggerCapture();
        }
      });
    </script>
  </body>
</html>
