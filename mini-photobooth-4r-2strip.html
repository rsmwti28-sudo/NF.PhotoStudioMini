<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mini Photobooth Lokal 4R (2 Strip)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0 0 12px 0;
      text-align: center;
      color: #f1f2f6;
    }
    .controls-top {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-small {
      background: #2f3542;
      color: #fff;
      border: 1px solid #57606f;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-small:active { background: #57606f; }
    input[type="file"] { display: none; }
    .camera-box {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 2px solid #2f3542;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mirror { transform: scaleX(-1); }
    #countdown {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 6.5rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 4px 16px rgba(0,0,0,0.85);
      pointer-events: none;
    }
    #flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease-out;
    }
    .step-indicator {
      margin-top: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffa502;
      text-align: center;
    }
    .preview-slots {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      width: 100%;
      max-width: 480px;
      justify-content: center;
    }
    .slot {
      flex: 1;
      aspect-ratio: 4 / 3;
      background: #1e272e;
      border: 2px dashed #57606f;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: #a4b0be;
      overflow: hidden;
      position: relative;
    }
    .slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .slot.active {
      border-color: #ff4757;
      color: #ffffff;
      font-weight: bold;
    }
    .slot.done {
      border-style: solid;
      border-color: #2ed573;
    }
    .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 480px;
      margin-top: 14px;
    }
    #captureBtn {
      flex: 2;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: #ff4757;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 71, 87, 0.4);
    }
    #captureBtn:disabled {
      background: #57606f;
      box-shadow: none;
      cursor: not-allowed;
    }
    #resetBtn {
      flex: 1;
      padding: 16px;
      font-size: 0.95rem;
      font-weight: 700;
      border: 1px solid #57606f;
      border-radius: 12px;
      background: #2f3542;
      color: #f1f2f6;
      cursor: pointer;
    }
    #resultSection {
      margin-top: 22px;
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
      background: #1e272e;
      padding: 16px;
      border-radius: 14px;
    }
    .badge-4r {
      background: #2ed573;
      color: #111;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    canvas#sheet4RCanvas {
      width: 100%;
      max-width: 300px;
      border: 3px solid #ffffff;
      border-radius: 4px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .result-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      width: 100%;
    }
    .btn-action {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-save { background: #2ed573; color: #111; }
    .btn-print { background: #1e90ff; color: #fff; }
    .status-text {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #a4b0be;
      text-align: center;
    }
    @media print {
      @page {
        size: 10.2cm 15.2cm;
        margin: 0;
      }
      body * { visibility: hidden; }
      #sheet4RCanvas, #sheet4RCanvas * { visibility: visible; }
      #sheet4RCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 10.2cm !important;
        height: 15.2cm !important;
        max-width: none !important;
        border: none !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>

  <h1>📸 Mini Photobooth 4R (2 Strip)</h1>

  <div class="controls-top">
    <button class="btn-small" id="switchCamBtn">🔄 Ganti Kamera</button>
    <label class="btn-small" for="frameInput">🖼️ Bingkai PNG (5,1x15,2 cm)</label>
    <input type="file" id="frameInput" accept="image/png" />
  </div>

  <div class="camera-box">
    <video id="video" autoplay playsinline></video>
    <div id="countdown"></div>
    <div id="flash"></div>
  </div>

  <div class="step-indicator" id="stepText">Siap Ambil Foto 1 dari 3</div>

  <div class="preview-slots">
    <div class="slot active" id="slot0">Foto 1</div>
    <div class="slot" id="slot1">Foto 2</div>
    <div class="slot" id="slot2">Foto 3</div>
  </div>

  <div class="action-row">
    <button id="captureBtn">Jepret Foto 1 (3 Detik)</button>
    <button id="resetBtn">Ulangi</button>
  </div>
  <div class="status-text" id="statusText">1 klik = hitung mundur 3 detik untuk 1 foto (mendukung remote shutter)</div>

  <div id="resultSection">
    <div class="badge-4r">Siap Cetak Kertas 4R (10,2 x 15,2 cm) • Otomatis 2 Strip</div>
    <canvas id="sheet4RCanvas"></canvas>
    <div class="result-actions">
      <a id="downloadLink" class="btn-action btn-save" download="photostrip-4R-2strip.png">💾 Simpan 4R</a>
      <button id="printBtn" class="btn-action btn-print">🖨️ Cetak 4R</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const countdownEl = document.getElementById('countdown');
    const flashEl = document.getElementById('flash');
    const captureBtn = document.getElementById('captureBtn');
    const resetBtn = document.getElementById('resetBtn');
    const switchCamBtn = document.getElementById('switchCamBtn');
    const frameInput = document.getElementById('frameInput');
    const sheet4RCanvas = document.getElementById('sheet4RCanvas');
    const resultSection = document.getElementById('resultSection');
    const downloadLink = document.getElementById('downloadLink');
    const printBtn = document.getElementById('printBtn');
    const statusText = document.getElementById('statusText');
    const stepText = document.getElementById('stepText');
    const slots = [
      document.getElementById('slot0'),
      document.getElementById('slot1'),
      document.getElementById('slot2')
    ];

    let currentFacing = 'environment';
    let currentStream = null;
    let isCountingDown = false;
    let customFrameImg = null;
    const totalPhotos = 3;
    let capturedFrames = [];

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: currentFacing,
            width: { ideal: 1920 },
            height: { ideal: 1440 }
          },
          audio: false
        });
        video.srcObject = currentStream;
        if (currentFacing === 'user') {
          video.classList.add('mirror');
        } else {
          video.classList.remove('mirror');
        }
      } catch (err) {
        statusText.textContent = 'Kamera tidak dapat diakses. Pastikan dibuka lewat HTTPS atau localhost.';
      }
    }

    switchCamBtn.addEventListener('click', () => {
      currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
      initCamera();
    });

    frameInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          customFrameImg = img;
          statusText.textContent = 'Bingkai PNG (5,1x15,2 cm) berhasil dimuat & digandakan ke 4R!';
          if (capturedFrames.length === totalPhotos) {
            render4RSheet();
          }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function runCountdown(seconds) {
      return new Promise(resolve => {
        let current = seconds;
        countdownEl.textContent = current;
        const timer = setInterval(() => {
          current--;
          if (current > 0) {
            countdownEl.textContent = current;
          } else {
            clearInterval(timer);
            countdownEl.textContent = '';
            flashEl.style.opacity = '0.9';
            setTimeout(() => { flashEl.style.opacity = '0'; }, 150);
            resolve();
          }
        }, 1000);
      });
    }

    function captureSingleFrame() {
      const tempCanvas = document.createElement('canvas');
      const targetRatio = 540 / 420;
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const videoRatio = vw / vh;

      let sx = 0, sy = 0, sWidth = vw, sHeight = vh;
      if (videoRatio > targetRatio) {
        sWidth = vh * targetRatio;
        sx = (vw - sWidth) / 2;
      } else {
        sHeight = vw / targetRatio;
        sy = (vh - sHeight) / 2;
      }

      tempCanvas.width = 540;
      tempCanvas.height = 420;
      const tCtx = tempCanvas.getContext('2d');

      if (currentFacing === 'user') {
        tCtx.translate(540, 0);
        tCtx.scale(-1, 1);
      }
      tCtx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, 540, 420);
      return tempCanvas;
    }

    function updateUIState() {
      const count = capturedFrames.length;
      slots.forEach((slot, idx) => {
        slot.classList.remove('active', 'done');
        if (idx < count) {
          slot.classList.add('done');
        } else if (idx === count) {
          slot.classList.add('active');
          slot.innerHTML = `Foto ${idx + 1}`;
        } else {
          slot.innerHTML = `Foto ${idx + 1}`;
        }
      });

      if (count < totalPhotos) {
        stepText.textContent = `Siap Ambil Foto ${count + 1} dari ${totalPhotos}`;
        captureBtn.textContent = `Jepret Foto ${count + 1} (3 Detik)`;
        captureBtn.disabled = false;
      } else {
        stepText.textContent = 'Selesai! 2 Strip Siap Cetak di Kertas 4R';
        captureBtn.textContent = 'Selesai (Klik Ulangi untuk Sesi Baru)';
        captureBtn.disabled = true;
      }
    }

    async function handleSingleCapture() {
      if (isCountingDown || capturedFrames.length >= totalPhotos) return;
      isCountingDown = true;
      captureBtn.disabled = true;

      const currentIdx = capturedFrames.length;
      stepText.textContent = `Bersiap untuk Foto ${currentIdx + 1}...`;

      await runCountdown(3);
      const frame = captureSingleFrame();
      capturedFrames.push(frame);

      const imgPreview = document.createElement('img');
      imgPreview.src = frame.toDataURL('image/jpeg', 0.85);
      slots[currentIdx].innerHTML = '';
      slots[currentIdx].appendChild(imgPreview);

      isCountingDown = false;
      updateUIState();

      if (capturedFrames.length === totalPhotos) {
        render4RSheet();
      }
    }

    function resetSession() {
      if (isCountingDown) return;
      capturedFrames = [];
      resultSection.style.display = 'none';
      updateUIState();
      statusText.textContent = 'Sesi diulang. Klik tombol untuk mengambil Foto 1.';
    }

    function drawSingleStrip(ctx, offsetX) {
      const stripW = 600;
      const stripH = 1800;
      const padding = 30;
      const photoW = 540;
      const photoH = 420;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(offsetX, 0, stripW, stripH);

      capturedFrames.forEach((frame, idx) => {
        const yPos = padding + idx * (photoH + padding);
        ctx.drawImage(frame, offsetX + padding, yPos, photoW, photoH);
      });

      if (customFrameImg) {
        ctx.drawImage(customFrameImg, offsetX, 0, stripW, stripH);
      } else {
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 4;
        ctx.strokeRect(offsetX + 10, 10, stripW - 20, stripH - 20);

        ctx.fillStyle = '#2f3542';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('MINI PHOTOBOOTH', offsetX + stripW / 2, stripH - 220);

        ctx.fillStyle = '#747d8c';
        ctx.font = '22px sans-serif';
        const today = new Date().toLocaleDateString('id-ID', {
          day: 'numeric', month: 'long', year: 'numeric'
        });
        ctx.fillText(today, offsetX + stripW / 2, stripH - 175);
      }
    }

    function render4RSheet() {
      // Ukuran 4R (10,2 x 15,2 cm = 4 x 6 inci pada 300 DPI = 1200 x 1800 px)
      const sheetW = 1200;
      const sheetH = 1800;
      sheet4RCanvas.width = sheetW;
      sheet4RCanvas.height = sheetH;
      const ctx = sheet4RCanvas.getContext('2d');

      // Gambar Strip Kiri (x = 0) dan Strip Kanan (x = 600)
      drawSingleStrip(ctx, 0);
      drawSingleStrip(ctx, 600);

      // Garis bantu potong tipis (putus-putus) tepat di tengah (x = 600)
      ctx.save();
      ctx.strokeStyle = 'rgba(150, 150, 150, 0.55)';
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.moveTo(600, 0);
      ctx.lineTo(600, sheetH);
      ctx.stroke();
      ctx.restore();

      resultSection.style.display = 'flex';
      downloadLink.href = sheet4RCanvas.toDataURL('image/png');
      resultSection.scrollIntoView({ behavior: 'smooth' });
    }

    captureBtn.addEventListener('click', handleSingleCapture);
    resetBtn.addEventListener('click', resetSession);
    printBtn.addEventListener('click', () => window.print());

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleSingleCapture();
      }
    });

    initCamera();
  </script>
</body>
</html>
